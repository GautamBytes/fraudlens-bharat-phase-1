name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11.15", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-index --no-deps -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Verify reproducible release artifacts
        if: matrix.python-version == '3.11.15'
        run: |
          artifact_tmp=$(mktemp -d)
          python -c "from pathlib import Path; from fraudlens.model_training import train_baseline; train_baseline(artifact_dir=Path('$artifact_tmp'))"
          for artifact in \
            baseline_classifier.joblib \
            vectorizer.joblib \
            label_encoder.joblib \
            metrics.json \
            model_metadata.json \
            artifact_manifest.json
          do
            cmp "$artifact_tmp/$artifact" "models/$artifact"
          done
      - name: Run tests
        run: python -m pytest
      - name: Verify deterministic demo evidence
        if: matrix.python-version == '3.11.15'
        run: |
          demo_tmp=$(mktemp -d)
          python -m fraudlens.generate_demo_cases --output "$demo_tmp"
          for artifact in \
            fake_kyc_sms.json \
            otp_phishing.json \
            fake_job_scam.json \
            investment_scam.json
          do
            cmp "$demo_tmp/$artifact" "outputs/demo_cases/$artifact"
          done
      - name: Validate dataset and provenance contract
        run: >-
          python -c "from fraudlens.data_contract import load_phase2_dataset;
          load_phase2_dataset('data/samples/phase2_dataset.csv', minimum_per_label=0)"
      - name: Verify deterministic evaluation evidence
        if: matrix.python-version == '3.11.15'
        run: |
          evaluation_tmp=$(mktemp -d)
          python -m fraudlens.evaluation --dataset data/samples/phase2_dataset.csv --output "$evaluation_tmp/first"
          python -m fraudlens.evaluation --dataset data/samples/phase2_dataset.csv --output "$evaluation_tmp/second"
          cmp "$evaluation_tmp/first/evaluation.json" "$evaluation_tmp/second/evaluation.json"
          cmp "$evaluation_tmp/first/summary.txt" "$evaluation_tmp/second/summary.txt"
          cmp "$evaluation_tmp/first/evaluation.json" outputs/phase2/evaluation.json
          cmp "$evaluation_tmp/first/summary.txt" outputs/phase2/summary.txt
          git diff --exit-code -- outputs/phase2
      - name: Verify deterministic research evidence
        if: matrix.python-version == '3.11.15'
        run: |
          research_tmp=$(mktemp -d)
          for run in first second
          do
            mkdir "$research_tmp/$run"
            python -m fraudlens.research_dataset \
              --dataset data/samples/phase2_dataset.csv \
              --output "$research_tmp/$run/dataset_audit.json"
            python -m fraudlens.research_benchmark \
              --dataset data/samples/phase2_dataset.csv \
              --output "$research_tmp/$run"
            python -m fraudlens.research_robustness \
              --dataset data/samples/phase2_dataset.csv \
              --output "$research_tmp/$run" \
              --bootstrap-samples 2000
          done
          for artifact in \
            dataset_audit.json \
            classification_benchmark.json \
            classification_summary.csv \
            robustness_benchmark.json \
            ablation_summary.csv
          do
            cmp "$research_tmp/first/$artifact" "$research_tmp/second/$artifact"
          done
          for artifact in \
            dataset_audit.json \
            classification_summary.csv \
            ablation_summary.csv
          do
            cmp "$research_tmp/first/$artifact" "outputs/research/$artifact"
          done
          git diff --exit-code -- outputs/research

  container-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build pinned production image
        run: docker build --tag fraudlens-bharat:ci .
      - name: Validate Compose and start restricted API
        run: |
          smoke_secret="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          FRAUDLENS_HMAC_SECRET="$smoke_secret" docker compose config --quiet
          docker run --detach --name fraudlens-ci \
            --publish 127.0.0.1:18000:8000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --tmpfs /data:rw,noexec,nosuid,nodev,uid=10001,gid=10001 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --env FRAUDLENS_ENVIRONMENT=production \
            --env FRAUDLENS_HMAC_SECRET="$smoke_secret" \
            --env FRAUDLENS_ALLOWED_HOSTS=localhost,127.0.0.1 \
            fraudlens-bharat:ci
      - name: Verify runtime, readiness, model, OCR, and safe logs
        run: |
          ready=false
          for attempt in $(seq 1 30)
          do
            if curl --fail --silent http://127.0.0.1:18000/ready > /tmp/ready.json
            then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          python3 -c "import json; payload=json.load(open('/tmp/ready.json')); assert payload == {'status':'ready','service':'fraudlens-bharat','version':'1.0.0'}"
          curl --fail --silent \
            --header 'Content-Type: application/json' \
            --data '{"text":"CI-PRIVATE-MARKER urgent KYC verification now","store_case":false}' \
            http://127.0.0.1:18000/analyze > /tmp/analyze.json
          python3 -c "import json; payload=json.load(open('/tmp/analyze.json')); assert payload['metadata']['stored'] is False; assert payload['predicted_label']"
          test "$(docker exec fraudlens-ci id -u)" = 10001
          test "$(docker inspect --format '{{.Config.User}}' fraudlens-ci)" = 10001:10001
          docker exec fraudlens-ci python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('pip', 'setuptools', 'pytest'))"
          docker exec fraudlens-ci tesseract --list-langs > /tmp/tesseract-languages.txt
          grep --fixed-strings --line-regexp eng /tmp/tesseract-languages.txt
          grep --fixed-strings --line-regexp hin /tmp/tesseract-languages.txt
          docker logs fraudlens-ci > /tmp/fraudlens-ci.log 2>&1
          if grep --fixed-strings CI-PRIVATE-MARKER /tmp/fraudlens-ci.log
          then
            echo "Sensitive request data appeared in logs"
            exit 1
          fi
          grep --fixed-strings '"route":"/ready"' /tmp/fraudlens-ci.log
          grep --fixed-strings '"route":"/analyze"' /tmp/fraudlens-ci.log
          cat /tmp/fraudlens-ci.log
      - name: Remove smoke container
        if: always()
        run: docker rm --force fraudlens-ci || true
